name: Build KernelSU-Next kernel

on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string
      lto:
        type: string
        default: thin
      ksu_ref:
        type: string
        default: ""
      artifacts:
        type: string
        default: "boot.img dtbo.img vendor_dlkm.img system_dlkm.img vendor_kernel_boot.img"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: false
          large-packages: true

      - name: Show disk space
        run: df -h

      - name: Setup swap (zram)
        run: |
          set -uo pipefail
          sudo sysctl -w vm.swappiness=100 || true
          if sudo modprobe zram 2>/dev/null; then
            sudo modprobe lz4 2>/dev/null || true
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 8589934592 | sudo tee /sys/block/zram0/disksize || true
            sudo mkswap /dev/zram0 && sudo swapon /dev/zram0 || true
          fi
          if [ -z "$(swapon --show --noheadings)" ]; then
            sudo fallocate -l 8G /mnt/extra-swapfile \
              || sudo dd if=/dev/zero of=/mnt/extra-swapfile bs=1M count=8192 status=none
            sudo chmod 600 /mnt/extra-swapfile
            sudo mkswap /mnt/extra-swapfile && sudo swapon /mnt/extra-swapfile || true
          fi
          free -h
          swapon --show || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libtinfo5 libncurses5

      - name: Allow unprivileged user namespaces (Bazel sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Clone GrapheneOS kernel
        run: |
          set -euo pipefail
          git clone --recurse-submodules --shallow-submodules --depth=1 \
            -b 17 https://gitlab.com/grapheneos/kernel_pixel_6.1.git

      - name: Setup KernelSU-Next
        working-directory: kernel_pixel_6.1/aosp
        run: |
          set -euo pipefail
          setup_url="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          if [ -n "${{ inputs.ksu_ref }}" ]; then
            curl -LSs "$setup_url" | bash -s "${{ inputs.ksu_ref }}"
          else
            curl -LSs "$setup_url" | bash -
          fi
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/CONFIG_MODULE_SIG_PROTECT=y/' arch/arm64/configs/gki_defconfig

      - name: Commit KernelSU-Next into ack submodule
        working-directory: kernel_pixel_6.1/aosp
        run: |
          set -euo pipefail
          KSU_TAG="$(git -C KernelSU-Next describe --abbrev=0 --tags 2>/dev/null || git -C KernelSU-Next rev-parse --short HEAD)"
          KSU_SHA="$(git -C KernelSU-Next rev-parse --short HEAD)"
          echo "KSU_TAG=$KSU_TAG" >> "$GITHUB_ENV"
          echo "KSU_SHA=$KSU_SHA" >> "$GITHUB_ENV"

          rm -rf KernelSU-Next/.git
          git add -A
          git -c commit.gpgsign=false -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Add KernelSU-Next ${KSU_TAG} (${KSU_SHA})"

      - name: Commit ack pointer in parent repo
        working-directory: kernel_pixel_6.1
        run: |
          set -euo pipefail
          git add common/ack
          git -c commit.gpgsign=false -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "Update ack: KernelSU-Next ${KSU_TAG}"
          echo "--- git status (should be clean) ---"
          git status --short --ignore-submodules=none
          test -z "$(git status --porcelain --ignore-submodules=none)"

      - name: Build kernel
        working-directory: kernel_pixel_6.1
        env:
          KLEAF_REPO_MANIFEST: aosp_manifest.xml
          KLEAF_MAKE_JOBS: 4
        run: |
          set -euo pipefail
          ( while true; do date; free -h; df -h /; sleep 60; done ) &
          MON=$!
          trap 'kill "$MON" 2>/dev/null || true' EXIT
          nice -n 19 ionice -c2 -n7 \
            ./build_${{ inputs.device }}.sh --lto=${{ inputs.lto }} \
              --config=local \
              --jobs=4 \
              --local_ram_resources=12000 \
              --local_cpu_resources=4

      - name: Verify and stage artifacts
        working-directory: kernel_pixel_6.1
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for f in $ARTIFACTS; do
            test -f "out/${{ inputs.device }}/dist/$f" || { echo "missing artifact: $f"; exit 1; }
            cp "out/${{ inputs.device }}/dist/$f" "$GITHUB_WORKSPACE/artifacts/"
          done
          ls -l "$GITHUB_WORKSPACE/artifacts"

      - name: Add install script
        run: |
          set -euo pipefail
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'cd "$(dirname "$0")"'
            printf '%s\n' ''
            printf '%s\n' 'fastboot oem disable-verification'
            printf '%s\n' 'fastboot flash boot boot.img'
            printf '%s\n' 'fastboot flash dtbo dtbo.img'
            printf '%s\n' 'fastboot flash vendor_kernel_boot vendor_kernel_boot.img'
            printf '%s\n' 'fastboot reboot fastboot'
            printf '%s\n' 'fastboot flash system_dlkm system_dlkm.img'
            printf '%s\n' 'fastboot flash vendor_dlkm vendor_dlkm.img'
          } > "$GITHUB_WORKSPACE/artifacts/install.sh"
          chmod +x "$GITHUB_WORKSPACE/artifacts/install.sh"
          cat "$GITHUB_WORKSPACE/artifacts/install.sh"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-${{ env.KSU_TAG }}-${{ inputs.device }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
