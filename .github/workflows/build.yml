name: Build SukiSU-Ultra kernel

on:
  workflow_call:
    inputs:
      device:
        required: true
        type: string
      kernel_repo:
        type: string
        default: kernel_pixel_6.1
      kernel_branch:
        type: string
        default: "17"
      device_names:
        type: string
        default: ""
      lto:
        type: string
        default: thin
      ksu_ref:
        type: string
        default: ""
      artifacts:
        type: string
        default: ""
      droidspaces:
        type: boolean
        default: true
      droidspaces_patch:
        type: string
        default: "default"
      droidspaces_ref:
        type: string
        default: "v6.6.0"
      anykernel:
        type: boolean
        default: true
      manual_hooks:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Manual hooks (default): pinned SukiSU-Ultra commit on the builtin-new branch.
      KSU_REF: 7f2d7e3f04234d90b5aa7ecec5f028ca54862e20
      # Kprobe fallback (manual_hooks=false): SukiSU-Ultra kprobe branch.
      KSU_KPROBE_REF: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: false
          large-packages: true

      - name: Show disk space
        run: df -h

      - name: Setup swap (zram)
        run: |
          set -uo pipefail
          sudo sysctl -w vm.swappiness=100 || true
          if sudo modprobe zram 2>/dev/null; then
            sudo modprobe lz4 2>/dev/null || true
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm >/dev/null 2>&1 || true
            echo 8589934592 | sudo tee /sys/block/zram0/disksize || true
            sudo mkswap /dev/zram0 && sudo swapon /dev/zram0 || true
          fi
          if [ -z "$(swapon --show --noheadings)" ]; then
            sudo fallocate -l 8G /mnt/extra-swapfile \
              || sudo dd if=/dev/zero of=/mnt/extra-swapfile bs=1M count=8192 status=none
            sudo chmod 600 /mnt/extra-swapfile
            sudo mkswap /mnt/extra-swapfile && sudo swapon /mnt/extra-swapfile || true
          fi
          free -h
          swapon --show || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libtinfo5 libncurses5

      - name: Allow unprivileged user namespaces (Bazel sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Clone GrapheneOS kernel
        run: |
          set -euo pipefail
          git clone --recurse-submodules --shallow-submodules --depth=1 \
            -b ${{ inputs.kernel_branch }} \
            https://gitlab.com/grapheneos/${{ inputs.kernel_repo }}.git kernel

      - name: Setup SukiSU-Ultra
        working-directory: kernel/aosp
        run: |
          set -euo pipefail
          setup_url="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"
          ref="${{ inputs.ksu_ref }}"
          if [ -z "$ref" ]; then
            if [ "${{ inputs.manual_hooks }}" = "true" ]; then
              ref="$KSU_REF"
            else
              ref="$KSU_KPROBE_REF"
            fi
          fi
          echo "SukiSU-Ultra ref: $ref (manual_hooks=${{ inputs.manual_hooks }})"
          curl -LSs "$setup_url" | bash -s "$ref"
          test -d KernelSU/.git || { echo "KernelSU checkout not found"; exit 1; }
          test -e drivers/kernelsu || { echo "drivers/kernelsu symlink missing"; exit 1; }
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/CONFIG_MODULE_SIG_PROTECT=y/' arch/arm64/configs/gki_defconfig

      - name: Apply SukiSU manual hooks
        if: ${{ inputs.manual_hooks }}
        working-directory: kernel/aosp
        run: |
          set -euo pipefail
          test -d KernelSU || { echo "KernelSU source missing"; exit 1; }
          # Guard against a kprobe branch (e.g. main) being selected: manual hooks
          # need the builtin branch entry points.
          grep -q "ksu_handle_execveat" KernelSU/kernel/feature/sucompat.c \
            || { echo "KernelSU checkout is not a manual-hook (builtin) branch"; exit 1; }
          grep -q "ksu_handle_newfstat_ret" KernelSU/kernel/runtime/ksud.c \
            || { echo "KernelSU checkout lacks ksu_handle_newfstat_ret"; exit 1; }

          # The pinned builtin-new branch has no kprobes; the kernel source must
          # call SukiSU entry points directly. Fail hard if an anchor is not found
          # exactly once so a kernel-source drift cannot silently ship no hooks.
          python3 - <<'PYEOF'
          import sys, pathlib

          def patch(path, anchor, insert, count=1, marker=None):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              if marker and marker in s:
                  print(f"already patched: {path}")
                  return
              n = s.count(anchor)
              if n != count:
                  sys.exit(f"ERROR: {path}: anchor found {n} times, expected {count}")
              s = s.replace(anchor, insert, 1)
              p.write_text(s, encoding="utf-8")
              print(f"patched: {path}")

          # fs/exec.c -- do_execveat_common: covers execve/execveat/compat,
          # not kernel_execve (it does not go through this helper).
          patch(
              "fs/exec.c",
              "static int do_execveat_common(int fd, struct filename *filename,\n"
              "\t\t\t      struct user_arg_ptr argv,\n"
              "\t\t\t      struct user_arg_ptr envp,\n"
              "\t\t\t      int flags)\n{\n",
              "static int do_execveat_common(int fd, struct filename *filename,\n"
              "\t\t\t      struct user_arg_ptr argv,\n"
              "\t\t\t      struct user_arg_ptr envp,\n"
              "\t\t\t      int flags)\n{\n"
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_execveat(int *, struct filename **, void *, void *, int *);\n"
              "\tif (unlikely(!IS_ERR(filename)))\n"
              "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "#endif\n",
              marker="ksu_handle_execveat",
          )

          # fs/open.c -- sys_faccessat (scope-minimized; faccessat2 not hooked).
          patch(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n"
              "\treturn do_faccessat(dfd, filename, mode, 0);\n}\n",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n"
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_faccessat(int *, const char __user **, int *, int *);\n"
              "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              "#endif\n"
              "\treturn do_faccessat(dfd, filename, mode, 0);\n}\n",
              marker="ksu_handle_faccessat",
          )

          # fs/stat.c -- sys_newfstatat (sucompat for stat()/lstat()).
          patch(
              "fs/stat.c",
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
              "\t\tstruct stat __user *, statbuf, int, flag)\n{\n"
              "\tstruct kstat stat;\n"
              "\tint error;\n",
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
              "\t\tstruct stat __user *, statbuf, int, flag)\n{\n"
              "#ifdef CONFIG_KSU\n"
              "\textern int ksu_handle_stat(int *, const char __user **, int *);\n"
              "\tksu_handle_stat(&dfd, &filename, &flag);\n"
              "#endif\n"
              "\tstruct kstat stat;\n"
              "\tint error;\n",
              marker="ksu_handle_stat",
          )

          # fs/stat.c -- sys_newfstat return hook (Android 16+ rc-size spoofing).
          patch(
              "fs/stat.c",
              "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n"
              "\tstruct kstat stat;\n"
              "\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n"
              "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
              "\treturn error;\n}\n",
              "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n"
              "\tstruct kstat stat;\n"
              "\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n"
              "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
              "#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n"
              "#pragma GCC diagnostic push\n"
              "#pragma GCC diagnostic ignored \"-Wdeclaration-after-statement\"\n"
              "\textern void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\n"
              "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
              "#pragma GCC diagnostic pop\n"
              "#endif\n\n"
              "\treturn error;\n}\n",
              marker="ksu_handle_newfstat_ret",
          )

          # kernel/reboot.c -- sys_reboot supercall entry.
          patch(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n{\n"
              "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n",
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n{\n"
              "#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n"
              "\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n"
              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
              "#endif\n"
              "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n",
              marker="ksu_handle_sys_reboot",
          )

          print("manual hooks applied")
          PYEOF

          # CONFIG_KSU is enabled by Kconfig default; manual hooks are used because
          # none of the runtime hook strategies are selected.
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          configs="CONFIG_KSU=y
          # CONFIG_KSU_KPROBES_KSUD is not set
          # CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set
          # CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
          apply_config() {
            local line="$1"
            line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && return 0
            if [[ "$line" == "#"*" is not set" ]]; then
              local key="${line#\# }"; key="${key% is not set}"
              if grep -q "^$key=" "$DEFCONFIG"; then
                sed -i "s|^$key=.*|# $key is not set|g" "$DEFCONFIG"
              elif ! grep -q "^# $key is not set" "$DEFCONFIG"; then
                echo "# $key is not set" >> "$DEFCONFIG"
              fi
              return 0
            fi
            local key="${line%%=*}" value="${line#*=}"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }
          while IFS= read -r line; do apply_config "$line"; done <<< "$configs"

          # Adding KSU options to gki_defconfig breaks its canonical-form check;
          # the actual running image is the GKI base, so disable the check.
          sed -i 's|^POST_DEFCONFIG_CMDS="check_defconfig"|POST_DEFCONFIG_CMDS=""|' build.config.gki
          grep -q '^POST_DEFCONFIG_CMDS=""' build.config.gki || { echo "failed to disable check_defconfig"; exit 1; }

          grep -q "ksu_handle_execveat" fs/exec.c
          grep -q "ksu_handle_faccessat" fs/open.c
          grep -q "ksu_handle_stat" fs/stat.c
          grep -q "ksu_handle_newfstat_ret" fs/stat.c
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c
          git diff --stat

      - name: Enable Droidspaces support
        if: ${{ inputs.droidspaces }}
        working-directory: kernel/aosp
        run: |
          set -euo pipefail
          ds_dir="$RUNNER_TEMP/Droidspaces-OSS"
          rm -rf "$ds_dir"
          git clone --depth=1 --branch "${{ inputs.droidspaces_ref }}" \
            https://github.com/ravindu644/Droidspaces-OSS.git "$ds_dir"
          case "${{ inputs.droidspaces_patch }}" in
            default) variant="6_7_8" ;;
            alt-123) variant="1_2_3" ;;
            alt-345) variant="3_4_5" ;;
            *) variant="${{ inputs.droidspaces_patch }}" ;;
          esac
          patch_file="$ds_dir/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${variant}.patch"
          test -f "$patch_file" || { echo "patch not found: $patch_file"; exit 1; }
          patch --dry-run -p1 --no-backup-if-mismatch < "$patch_file"
          patch -p1 --no-backup-if-mismatch < "$patch_file"

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          configs="CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y"
          apply_config() {
            local line="$1"
            line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && return 0
            local key="${line%%=*}" value="${line#*=}"
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
          }
          while IFS= read -r line; do apply_config "$line"; done <<< "$configs"

          # The kernel that actually runs is the GKI base image (boot.img), so these
          # options must live in gki_defconfig. Editing gki_defconfig breaks its
          # canonical-form check, so disable that check.
          sed -i 's|^POST_DEFCONFIG_CMDS="check_defconfig"|POST_DEFCONFIG_CMDS=""|' build.config.gki
          grep -q '^POST_DEFCONFIG_CMDS=""' build.config.gki || { echo "failed to disable check_defconfig"; exit 1; }

          # CONFIG_USER_NS makes make_kuid()/from_kuid() external, so modules reference
          # them. They are not part of the GKI KMI, so the base trims them and modpost
          # fails. Add them to the KMI via a new symbol list file, registered in the
          # explicit filegroup the GKI base actually uses.
          {
            printf '%s\n' '[abi_symbol_list]'
            printf '%s\n' '  make_kuid'
            printf '%s\n' '  from_kuid'
            printf '%s\n' '  from_kuid_munged'
            printf '%s\n' '  make_kgid'
            printf '%s\n' '  from_kgid'
            printf '%s\n' '  from_kgid_munged'
            printf '%s\n' '  make_kprojid'
            printf '%s\n' '  from_kprojid'
            printf '%s\n' '  from_kprojid_munged'
            printf '%s\n' '  current_in_userns'
            printf '%s\n' '  __put_user_ns'
          } > android/abi_gki_aarch64_droidspaces
          sed -i '/name = "aarch64_additional_kmi_symbol_lists",/,/^)/ s|# keep sorted|# keep sorted\n        "android/abi_gki_aarch64_droidspaces",|' BUILD.bazel
          grep -q 'android/abi_gki_aarch64_droidspaces' BUILD.bazel || { echo "failed to register KMI list"; exit 1; }
          git diff --stat

      - name: Commit SukiSU-Ultra into ack submodule
        working-directory: kernel/aosp
        run: |
          set -euo pipefail
          KSU_TAG="$(git -C KernelSU describe --abbrev=0 --tags 2>/dev/null || git -C KernelSU rev-parse --short HEAD)"
          KSU_SHA="$(git -C KernelSU rev-parse --short HEAD)"
          echo "KSU_TAG=$KSU_TAG" >> "$GITHUB_ENV"
          echo "KSU_SHA=$KSU_SHA" >> "$GITHUB_ENV"

          exclude="$(git rev-parse --git-path info/exclude)"
          grep -qxF 'KernelSU/' "$exclude" 2>/dev/null || printf '%s\n' 'KernelSU/' >> "$exclude"
          git add -A
          msg="Add SukiSU-Ultra ${KSU_TAG} (${KSU_SHA})"
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            msg="${msg} + Droidspaces kABI patch"
          fi
          git -c commit.gpgsign=false -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "$msg"

      - name: Commit ack pointer in parent repo
        working-directory: kernel
        run: |
          set -euo pipefail
          git add -A
          msg="Update ack: SukiSU-Ultra ${KSU_TAG}"
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            msg="${msg} + Droidspaces ${{ inputs.droidspaces_patch }} (${{ inputs.droidspaces_ref }})"
          fi
          git -c commit.gpgsign=false -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "$msg"
          echo "--- git status (should be clean) ---"
          git status --short --ignore-submodules=none
          test -z "$(git status --porcelain --ignore-submodules=none)"

      - name: Build kernel
        working-directory: kernel
        env:
          KLEAF_MAKE_JOBS: 4
        run: |
          set -euo pipefail
          if [ "${{ inputs.kernel_repo }}" = "kernel_pixel_6.6" ]; then
            manifest_args=(--repo_manifest="$(realpath .)":"$(realpath aosp_manifest.xml)")
          else
            export KLEAF_REPO_MANIFEST=aosp_manifest.xml
            manifest_args=()
          fi
          ( while true; do date; free -h; df -h /; sleep 60; done ) &
          MON=$!
          trap 'kill "$MON" 2>/dev/null || true' EXIT
          nice -n 19 ionice -c2 -n7 \
            ./build_${{ inputs.device }}.sh --lto=${{ inputs.lto }} \
              --disable_randstruct \
              "${manifest_args[@]}" \
              --config=local \
              --jobs=4 \
              --local_ram_resources=12000 \
              --local_cpu_resources=4

      - name: Resolve artifact list
        env:
          ARTIFACTS_INPUT: ${{ inputs.artifacts }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          if [ -n "$ARTIFACTS_INPUT" ]; then
            artifacts="$ARTIFACTS_INPUT"
          else
            case "$DEVICE" in
              raviole|bluejay) artifacts="boot.img dtbo.img vendor_dlkm.img" ;;
              *) artifacts="boot.img dtbo.img vendor_dlkm.img system_dlkm.img vendor_kernel_boot.img" ;;
            esac
          fi
          echo "ARTIFACTS=$artifacts" >> "$GITHUB_ENV"
          echo "Artifacts: $artifacts"

      - name: Verify and stage artifacts
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for f in $ARTIFACTS; do
            test -f "out/${{ inputs.device }}/dist/$f" || { echo "missing artifact: $f"; exit 1; }
            cp "out/${{ inputs.device }}/dist/$f" "$GITHUB_WORKSPACE/artifacts/"
          done
          printf '%s\n' "${{ inputs.device }}" > "$GITHUB_WORKSPACE/artifacts/device.txt"
          printf '%s\n' "${KSU_TAG}" > "$GITHUB_WORKSPACE/artifacts/version.txt"
          ls -l "$GITHUB_WORKSPACE/artifacts"

      - name: Add install script
        run: |
          set -euo pipefail
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' "cd \"\$(dirname \"\$0\")\""
            printf '%s\n' ''
            printf '%s\n' 'fastboot oem disable-verification'
            for f in boot dtbo vendor_kernel_boot; do
              if echo " $ARTIFACTS " | grep -q " $f.img "; then
                printf 'fastboot flash %s %s.img\n' "$f" "$f"
              fi
            done
            if echo " $ARTIFACTS " | grep -qE " (system_dlkm|vendor_dlkm)\.img "; then
              printf '%s\n' 'fastboot reboot fastboot'
              for f in system_dlkm vendor_dlkm; do
                if echo " $ARTIFACTS " | grep -q " $f.img "; then
                  printf 'fastboot flash %s %s.img\n' "$f" "$f"
                fi
              done
            fi
          } > "$GITHUB_WORKSPACE/artifacts/install.sh"
          chmod +x "$GITHUB_WORKSPACE/artifacts/install.sh"
          cat "$GITHUB_WORKSPACE/artifacts/install.sh"

      - name: Build AnyKernel3 package
        if: ${{ inputs.anykernel }}
        env:
          DEVICE: ${{ inputs.device }}
          AK3_REF: "020dfeccf9d7e962a48400fc94d3e451df92eead"
        run: |
          set -euo pipefail
          ak3="$RUNNER_TEMP/AnyKernel3"
          stage="$RUNNER_TEMP/ak3"
          rm -rf "$ak3" "$stage"

          git clone -q https://github.com/osm0sis/AnyKernel3.git "$ak3"
          git -C "$ak3" checkout -q --detach "$AK3_REF"
          test "$(git -C "$ak3" rev-parse HEAD)" = "$AK3_REF"

          mkdir -p "$stage"
          cp -a "$ak3/tools" "$ak3/META-INF" "$stage/"
          for f in $ARTIFACTS; do
            cp "$GITHUB_WORKSPACE/artifacts/$f" "$stage/$f"
          done

          # AnyKernel3 device check runs against ro.product.device, which is the
          # Pixel model codename (e.g. husky, mustang), not the kernel codename.
          names="${{ inputs.device_names }}"
          [ -n "$names" ] || names="${{ inputs.device }}"

          {
            printf '%s\n' '### AnyKernel3 Ramdisk Mod Script'
            printf '%s\n' "properties() { '"
            printf 'kernel.string=SukiSU-Ultra for GrapheneOS (%s)\n' "${{ inputs.device }}"
            printf '%s\n' 'do.devicecheck=1'
            printf '%s\n' 'do.modules=0'
            printf '%s\n' 'do.systemless=0'
            printf '%s\n' 'do.cleanup=1'
            printf '%s\n' 'do.cleanuponabort=0'
            n=0
            for dn in $names; do
              n=$((n + 1))
              printf 'device.name%d=%s\n' "$n" "$dn"
            done
            printf '%s\n' 'supported.versions='
            printf '%s\n' "'; }"
            printf '\n'
          } > "$stage/anykernel.sh"

          cat >> "$stage/anykernel.sh" <<'AK3EOF'
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;

          . tools/ak3-core.sh;

          real_slot() {
            local s
            s="$(grep -o 'androidboot[.]slot_suffix=[^ ]*' /proc/cmdline 2>/dev/null | cut -d= -f2)"
            [ "$s" ] || s="$(grep -o 'androidboot[.]slot=[^ ]*' /proc/cmdline 2>/dev/null | cut -d= -f2)"
            case "$s" in
              _a|_b) echo "$s" ;;
              *) echo "" ;;
            esac
          }

          # system_dlkm/vendor_dlkm are logical partitions inside super and
          # cannot be written in place while the device is booted (SukiSU-Ultra
          # Manager / Kernel Flasher run in the running system and do not unmap
          # them). Replace them the way Kernel Flasher does: create a shadow
          # logical partition and swap it in; fall back to resizing when super
          # has no free space. This also handles the inactive slot when a
          # GrapheneOS OTA is staged but not yet rebooted.
          flash_logical() {
            local p img size lptools httools target dev verity rs
            p="$1"; img="$AKHOME/$2"
            [ -f "$img" ] || return 0
            lptools="$AKHOME/tools/lptools_static"
            httools="$AKHOME/tools/httools_static"
            size="$(wc -c < "$img")"
            target="${p}${SLOT}"
            dev="/dev/block/mapper/${p}${SLOT}"
            verity="/dev/block/mapper/${p}-verity"
            rs="$(real_slot)"

            "$lptools" remove "${p}_ak3" >/dev/null 2>&1
            if "$lptools" create "${p}_ak3" "$size" >/dev/null 2>&1; then
              "$lptools" unmap "${p}_ak3" >/dev/null 2>&1
              "$lptools" map "${p}_ak3" >/dev/null 2>&1 || abort "map ${p}_ak3 failed. Aborting..."
              dd if="$img" of="/dev/block/mapper/${p}_ak3" 2>/dev/null || abort "write ${p}_ak3 failed. Aborting..."
              "$lptools" replace "${p}_ak3" "$target" >/dev/null 2>&1 || abort "replace ${target} failed. Aborting..."
              ui_print " " "Flashed ${p} (shadow replace)"
              return 0
            fi

            ui_print " " "create ${p}_ak3 failed; resizing ${target}..."
            # Only the running slot's partition is mounted and in use.
            if [ "$SLOT" = "$rs" ]; then
              "$httools" umount "$p" >/dev/null 2>&1
              [ -e "$verity" ] && "$lptools" unmap "${p}-verity" >/dev/null 2>&1
            fi
            [ -e "$dev" ] && "$lptools" unmap "$target" >/dev/null 2>&1
            "$lptools" resize "$target" "$size" >/dev/null 2>&1 || abort "resize ${target} failed. Aborting..."
            "$lptools" map "$target" >/dev/null 2>&1 || abort "map ${target} failed. Aborting..."
            dd if="$img" of="$dev" 2>/dev/null || abort "write ${p} failed. Aborting..."
            if [ "$SLOT" = "$rs" ]; then
              "$httools" mount "$p" >/dev/null 2>&1 || abort "mount ${p} failed. Aborting..."
            else
              "$lptools" unmap "$target" >/dev/null 2>&1
            fi
            ui_print " " "Flashed ${p} (resize)"
          }
          AK3EOF
          for f in $ARTIFACTS; do
            case "$f" in
              system_dlkm.img|vendor_dlkm.img)
                printf 'flash_logical %s %s\n' "${f%.img}" "$f" ;;
              *)
                printf 'flash_generic %s\n' "${f%.img}" ;;
            esac
          done >> "$stage/anykernel.sh"

          sh -n "$stage/anykernel.sh"
          test -f "$stage/META-INF/com/google/android/update-binary"
          test -f "$stage/tools/ak3-core.sh"
          test -f "$stage/tools/lptools_static"
          test -f "$stage/tools/httools_static"
          grep -q "^device.name1=" "$stage/anykernel.sh"
          grep -q "^flash_generic boot\$" "$stage/anykernel.sh"
          for f in $ARTIFACTS; do test -f "$stage/$f"; done

          zipfile="$GITHUB_WORKSPACE/artifacts/AnyKernel3-${DEVICE}.zip"
          rm -f "$zipfile"
          ( cd "$stage" && zip -rq9 "$zipfile" . )
          unzip -t "$zipfile" >/dev/null
          echo "--- AnyKernel3-${DEVICE}.zip ---"
          unzip -l "$zipfile"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-${{ env.KSU_TAG }}-${{ inputs.device }}${{ inputs.droidspaces && '-ds' || '' }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
