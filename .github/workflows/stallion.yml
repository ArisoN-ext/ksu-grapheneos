name: Build stallion (Pixel 10a)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: LTO mode
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      ksu_ref:
        description: KernelSU-Next tag/commit (empty = v3.4.2)
        type: string
        required: false
        default: "v3.4.2"
      anykernel:
        description: Bundle an AnyKernel3 flashable zip
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-stallion
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      device: stallion
      kernel_repo: kernel_pixel_6.1
      kernel_branch: "17-stallion"
      lto: ${{ inputs.lto || 'thin' }}
      ksu_ref: ${{ inputs.ksu_ref || 'v3.4.2' }}
      anykernel: ${{ inputs.anykernel || false }}
