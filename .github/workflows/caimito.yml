name: Build caimito (Pixel 9 / 9 Pro / 9 Pro XL)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: LTO mode
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      ksu_ref:
        description: KernelSU-Next tag/commit (empty = latest tag)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-caimito
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      device: caimito
      lto: ${{ inputs.lto || 'thin' }}
      ksu_ref: ${{ inputs.ksu_ref || '' }}
