name: Release all devices

on:
  workflow_dispatch:
    inputs:
      lto:
        description: LTO mode
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      ksu_ref:
        description: SukiSU-Ultra tag/commit (empty = per manual_hooks)
        type: string
        required: false
        default: ""
      droidspaces:
        description: Enable Droidspaces support (experimental)
        type: boolean
        default: true
      droidspaces_patch:
        description: Droidspaces kABI patch variant
        type: choice
        options:
          - default
          - alt-123
          - alt-345
        default: default
      anykernel:
        description: Bundle an AnyKernel3 flashable zip
        type: boolean
        default: true
      manual_hooks:
        description: Use SukiSU manual hooks (off = kprobes)
        type: boolean
        default: true
      release:
        description: Create a GitHub Release (artifacts are always uploaded)
        type: boolean
        default: true
  schedule:
    - cron: '0 21 * * 0'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
    steps:
      - id: matrix
        env:
          ENABLED_DEVICES: ${{ vars.ENABLED_DEVICES }}
        run: |
          set -euo pipefail
          known=(pantah lynx shusky akita raviole bluejay caimito comet tegu rango muzel stallion)
          enabled="${ENABLED_DEVICES// /}"
          selected=()
          if [ -z "$enabled" ]; then
            selected=("${known[@]}")
          else
            IFS=',' read -ra want <<< "$enabled"
            for dev in "${known[@]}"; do
              for w in "${want[@]}"; do
                if [ "$w" = "$dev" ]; then
                  selected+=("$dev")
                fi
              done
            done
          fi
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No devices selected; aborting." >&2
            exit 1
          fi
          entries=()
          for dev in "${selected[@]}"; do
            case "$dev" in
              rango|muzel) repo="kernel_pixel_6.6"; branch="17" ;;
              stallion) repo="kernel_pixel_6.1"; branch="17-stallion" ;;
              *) repo="kernel_pixel_6.1"; branch="17" ;;
            esac
            case "$dev" in
              raviole) names="raviole oriole raven" ;;
              pantah) names="pantah cheetah panther" ;;
              shusky) names="shusky husky shiba" ;;
              caimito) names="caimito tokay caiman komodo" ;;
              muzel) names="muzel mustang blazer frankel" ;;
              *) names="$dev" ;;
            esac
            entries+=("$(jq -nc --arg d "$dev" --arg r "$repo" --arg b "$branch" --arg n "$names" \
              '{device:$d, kernel_repo:$r, kernel_branch:$b, device_names:$n}')")
          done
          json="$(printf '%s\n' "${entries[@]}" | jq -sc .)"
          echo "devices=$json" >> "$GITHUB_OUTPUT"
          echo "Selected devices: $json"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.devices) }}
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device.device }}
      kernel_repo: ${{ matrix.device.kernel_repo }}
      kernel_branch: ${{ matrix.device.kernel_branch }}
      device_names: ${{ matrix.device.device_names }}
      lto: ${{ inputs.lto || 'thin' }}
      ksu_ref: ${{ inputs.ksu_ref || '' }}
      droidspaces: ${{ github.event_name == 'schedule' || inputs.droidspaces }}
      droidspaces_patch: ${{ inputs.droidspaces_patch || 'default' }}
      anykernel: ${{ github.event_name == 'schedule' || inputs.anykernel }}
      manual_hooks: ${{ github.event_name == 'schedule' || inputs.manual_hooks }}

  release:
    if: ${{ github.event_name == 'schedule' || inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DS_SUFFIX: ${{ inputs.droidspaces && '-ds' || '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ksu-*
          path: dist

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p release
          version=""
          for d in dist/*/; do
            device="$(cat "$d/device.txt")"
            if [ -z "$version" ]; then
              version="$(cat "$d/version.txt")"
            fi
            chmod +x "$d/install.sh"
            ( cd "$d" && zip -r "$GITHUB_WORKSPACE/release/${device}${DS_SUFFIX}.zip" . \
                -x 'device.txt' -x 'version.txt' )
          done
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ksu-${VERSION}${DS_SUFFIX}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            release/*.zip
